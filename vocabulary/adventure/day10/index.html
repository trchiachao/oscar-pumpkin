#player{position:absolute;width:70px;height:104px;z-index:20;transform:translate(-50%,-78%);filter:drop-shadow(0 5px 3px #0005);pointer-events:none}
#player img{width:100%;height:100%;object-fit:contain}
#star{position:absolute;width:58px;height:58px;z-index:18;transform:translate(-50%,-50%);pointer-events:none}
#star:before{content:"★";font-size:54px;line-height:58px;color:#ffe35d;text-shadow:0 0 7px #fff,0 0 18px #ffbd18,0 3px 0 #8b6514;animation:pulse .55s infinite alternate}
@keyframes pulse{from{opacity:.55;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
#hint{position:absolute;z-index:25;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#183025d9;color:#fff;border-radius:999px;padding:8px 15px;font-size:12px;white-space:nowrap;pointer-events:none}
#toast{position:absolute;z-index:45;left:50%;top:92px;transform:translateX(-50%);background:#1d3229e8;color:#fff;padding:9px 15px;border-radius:18px;font-weight:800;display:none}
.overlay{position:absolute;inset:0;z-index:60;background:#14221bd2;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(650px,95vw);max-height:88dvh;overflow:auto;background:#fffdf5;border-radius:22px;padding:24px;box-shadow:0 15px 45px #0007;border:3px solid #e9c98a}
.meta{font-size:13px;color:#6c746f;font-weight:800}.card h2{margin:7px 0 10px;font-size:28px;color:#283b31}.story{font-size:18px;line-height:1.6}
.word{font-size:34px;font-weight:950;color:#b54b3f;margin:10px 0}.opts{display:grid;gap:9px;margin-top:14px}
button{font:inherit}.opt,.main{min-height:52px;border-radius:13px;font-size:17px;font-weight:850;padding:12px 14px}
.opt{border:2px solid #9aa69f;background:#fff;text-align:left}.main{width:100%;border:0;background:#263e32;color:#fff;margin-top:14px}
.spell{width:100%;font-size:23px;padding:12px;border:2px solid #7d8b84;border-radius:12px;user-select:text;-webkit-user-select:text;background:white}
.feedback{min-height:28px;font-weight:900;margin-top:8px}.good{color:#26703f}.bad{color:#b43c33}
@media(max-width:760px){#hud{height:64px;gap:8px;padding:7px 10px}.title{font-size:14px;min-width:120px}.info{padding-left:8px}.big{font-size:16px}#face{width:44px;height:44px}#player{width:62px;height:92px}}

<script>

 {time:"10:30",phase:"第3節",place:"操場",x:68,y:39,word:"control",zh:"控制；掌控",title:"Choose the best word.",text:"During P.E. class, Oscar tries to ______ the ball before it rolls onto the running track.",translation:"體育課時，Oscar 試著在球滾上跑道前控制住它。",wrong:["trust","cage","confused"]},
 {time:"11:10",phase:"下課",place:"303教室",x:20,y:36,word:"confused",zh:"困惑的",title:"Choose the best word.",text:"Back in Classroom 303, Oscar feels ______ because he cannot remember which workbook the teacher asked for.",translation:"回到 303 教室，Oscar 覺得很困惑，因為他想不起來老師剛剛要大家拿哪一本習作。",wrong:["sensible","ordinary","training"]},

 {time:"12:35",phase:"午休",place:"303教室",x:30,y:24,word:"training",zh:"訓練",title:"Choose the best word.",text:"Before nap time in Classroom 303, Oscar remembers that he has basketball ______ after school.",translation:"303 教室午休前，Oscar 想起自己放學後還有籃球訓練。",wrong:["trust","ordinary","patience"]},
 {time:"14:10",phase:"下課",place:"綠廣場",x:67,y:84,word:"trust",zh:"信任；相信",title:"Choose the best word.",text:"At the Green Plaza, Oscar's friend says, “Come with me. I know where your ball is.” Oscar decides to ______ him.",translation:"在綠廣場，Oscar 的朋友說：「跟我來，我知道你的球在哪裡。」Oscar 決定相信他。",wrong:["control","cage","upset"]},

];
let idx=0,learned=0,active=false,pos={x:50,y:55},touchStart=null,dir={x:0,y:0},raf=0,last=0;
const world=document.querySelector("#world"),player=document.querySelector("#player"),star=document.querySelector("#star"),modal=document.querySelector("#modal");
const dots=document.querySelector("#dots"); for(let i=0;i<10;i++){let d=document.createElement("span");d.className="dot";dots.appendChild(d)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function setPlayer(){player.style.left=pos.x+"%";player.style.top=pos.y+"%"}
function setEvent(){
 const e=events[idx]; clock.textContent=e.time;phase.textContent=e.phase;place.textContent=e.place;count.textContent=learned+" / 10";
 star.style.left=e.x+"%";star.style.top=e.y+"%";star.style.display="block";
 [...dots.children].forEach((d,i)=>d.classList.toggle("on",i<learned));
}
function pxy(ev){const r=world.getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width*100,y:(ev.clientY-r.top)/r.height*100}}
function begin(ev){if(active)return;touchStart=pxy(ev);dir={x:0,y:0};try{world.setPointerCapture(ev.pointerId)}catch(e){};last=0;if(!raf)raf=requestAnimationFrame(move);ev.preventDefault()}
function drag(ev){if(!touchStart||active)return;const p=pxy(ev),dx=p.x-touchStart.x,dy=p.y-touchStart.y,d=Math.hypot(dx,dy);if(d<1.5){dir={x:0,y:0}}else{const power=Math.min(1,d/12);dir={x:dx/d*power,y:dy/d*power}}ev.preventDefault()}
function stop(){touchStart=null;dir={x:0,y:0};last=0;if(raf){cancelAnimationFrame(raf);raf=0}}
function move(t){if(!touchStart||active){raf=0;return}if(!last)last=t;const dt=Math.min(32,t-last);last=t;const speed=.028*dt;pos.x=Math.max(3,Math.min(97,pos.x+dir.x*speed));pos.y=Math.max(12,Math.min(96,pos.y+dir.y*speed));setPlayer();check();raf=requestAnimationFrame(move)}
world.addEventListener("pointerdown",begin,{passive:false});world.addEventListener("pointermove",drag,{passive:false});world.addEventListener("pointerup",stop);world.addEventListener("pointercancel",stop);
function check(){const e=events[idx];if(Math.hypot(pos.x-e.x,pos.y-e.y)<5.3){stop();openEvent(e)}}
function openEvent(e){
 active=true;star.style.display="none";
 const opts=shuffle([{t:e.word,ok:true},...e.wrong.map(t=>({t,ok:false}))]);
 modal.innerHTML=`<div class="overlay"><div class="card"><div class="meta">${e.time}・${e.phase}・${e.place}</div><h2>${e.title}</h2><div class="story" style="font-size:22px;font-weight:750;line-height:1.7">${e.text}</div><div class="opts">${opts.map(o=>`<button class="opt" data-ok="${o.ok}">${o.t}</button>`).join("")}</div></div></div>`;
 modal.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b.dataset.ok==="true"));
}
function answer(ok){const e=events[idx];if(ok){learned++;const full=e.text.replace("______",`<b style="color:#b54b3f">${e.word}</b>`);modal.innerHTML=`<div class="overlay"><div class="card"><h2>答對了！ ✨</h2><div class="story">${full}</div><div style="margin-top:12px;padding:12px 14px;background:#f5efe1;border-radius:12px;font-size:17px;line-height:1.55">${e.translation}</div><div style="margin-top:10px;font-weight:850;color:#56635c"><b>${e.word}</b>＝${e.zh}</div><button class="main" id="next">繼續</button></div></div>`;next.onclick=advance}else learn(e)}
function speak(w){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.78;speechSynthesis.speak(u)}
function learn(e){
 modal.innerHTML=`<div class="overlay"><div class="card"><div class="meta">先把這個字學會</div><div class="word">${e.word}</div><div class="story">${e.zh}</div><div style="margin:12px 0;padding:12px 14px;background:#f5efe1;border-radius:12px;line-height:1.55">${e.text.replace("______",`<b>${e.word}</b>`)}<br><span style="color:#5f6963">${e.translation}</span></div><button class="opt" id="say">🔊 聽發音</button><p class="story">完整拼對 <b>${e.word}</b> 才能繼續。</p><input id="spell" class="spell" autocomplete="off" autocapitalize="none" spellcheck="false"><div id="fb" class="feedback"></div><button class="main" id="checkSpell">確認拼字</button></div></div>`;
 say.onclick=()=>speak(e.word);checkSpell.onclick=()=>{let v=spell.value.trim().toLowerCase();if(v===e.word){learned++;fb.innerHTML='<span class="good">✓ 拼對了！</span>';setTimeout(advance,450)}else{fb.innerHTML='<span class="bad">還不對，再看一次上面的單字。</span>';spell.value="";spell.focus();speak(e.word)}};speak(e.word);setTimeout(()=>spell.focus(),200)
}
function advance(){idx++;active=false;modal.innerHTML="";if(idx<events.length){setEvent();toast.textContent=`${events[idx].time}・${events[idx].phase}`;toast.style.display="block";setTimeout(()=>toast.style.display="none",1100)}else finish()}
function finish(){clock.textContent="15:50";phase.textContent="放學";place.textContent="完成！";count.textContent="10 / 10";[...dots.children].forEach(d=>d.classList.add("on"));star.style.display="none";active=true;modal.innerHTML=`<div class="overlay"><div class="card"><div class="meta">15:50・放學</div><h2>今天的校園冒險完成！ 🎒</h2><div class="story">10 個 Lesson 10 單字全部遇到了：<br><br><b>ordinary・sensible・cage・suspiciously・control・confused・patience・training・trust・upset</b></div><button class="main" onclick="location.reload()">再玩一次</button></div></div>`}
setPlayer();setEvent();
</script>
