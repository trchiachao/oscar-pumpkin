<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocabulary｜Oscar的南瓜田</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
  color:#39291d;
  background:linear-gradient(#fff9ed,#fff0ce);
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}

.back{
  display:inline-block;
  margin-bottom:18px;
  text-decoration:none;
  color:#765c3d;
  font-weight:800;
}

h1{
  text-align:center;
  font-size:38px;
  margin:10px 0 5px;
}

.sub{
  text-align:center;
  color:#80684e;
  margin-bottom:35px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:22px;
}

.card{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:230px;
  padding:28px;
  border-radius:28px;
  text-decoration:none;
  color:#39291d;
  background:#fff;
  border:3px solid #e6b354;
  box-shadow:0 10px 28px #76501c20;
  transition:.15s;
}

.card:active{
  transform:scale(.97);
}

.icon{
  font-size:55px;
  margin-bottom:12px;
}

.card h2{
  margin:0 0 8px;
  font-size:27px;
}

.card p{
  margin:0;
  color:#80684e;
  line-height:1.6;
}

.adventure{
  border-color:#7bb79a;
  background:#f6fff9;
}

@media(max-width:650px){
  .cards{grid-template-columns:1fr}
  .card{min-height:180px}
  h1{font-size:32px}
}
</style>
</head>

<body>

<div class="wrap">

  <a class="back" href="../">← 回到 Oscar 的南瓜田</a>

  <h1>Vocabulary</h1>
  <div class="sub">今天想怎麼練習英文呢？</div>

  <div class="cards">

    <a class="card" href="./practice/">
      <div class="icon">🔤</div>
      <h2>單字練習</h2>
      <p>聽一聽、拼一拼，把學過的單字記得更熟。</p>
    </a>

    <a class="card adventure" href="./adventure/">
      <div class="icon">🎒</div>
      <h2>校園探險</h2>
      <p>跟著 Oscar 在校園裡移動，用英文解開一天中的小事件。</p>
    </a>

  </div>

</div>

</body>
</html>
