<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Oscar的南瓜田｜Spelling Flashcards</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#34271f;background:#fff9ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#fff9ed,#fff3d7)}button{font:inherit}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:3px solid #e7b85b;border-radius:26px;box-shadow:0 10px 30px #7a54221c;padding:24px}.brand{text-align:center;font-size:34px;font-weight:900}.pump{font-size:42px}.sub{text-align:center;color:#80684e;margin:6px 0 20px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choices button,.action{border:0;border-radius:16px;padding:14px;background:#f2a23a;color:#3b2815;font-weight:800;box-shadow:0 3px 0 #c87d1f;cursor:pointer}.choices button:last-child{grid-column:2}.game{display:none}.top{display:flex;justify-content:space-between;gap:12px;font-weight:800;color:#765c3d}.listen{display:block;margin:28px auto 14px;background:#f2a23a;border:0;border-radius:999px;padding:14px 22px;font-size:20px;font-weight:900}.slots{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;min-height:54px;margin:16px 0 24px}.slot{width:36px;border-bottom:4px solid #5f4a37;text-align:center;font-size:30px;font-weight:900;height:45px}.keyboard{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:820px;margin:0 auto}.keyrow{display:flex;gap:8px;justify-content:center;width:100%}.keyrow:nth-child(2){padding-left:3%;padding-right:3%}.keyrow:nth-child(3){padding-left:10%;padding-right:10%}.key{border:0;border-radius:12px;background:#fff0c7;padding:15px 4px;font-weight:900;font-size:20px;box-shadow:0 2px 0 #d7bb7a;flex:1;max-width:72px;min-width:48px}.controls{display:flex;justify-content:center;gap:10px;margin-top:14px}.controls button{border:0;border-radius:14px;padding:12px 18px;font-weight:900}.del{background:#eee}.submit{background:#79c267}.msg{text-align:center;min-height:30px;font-weight:900;font-size:19px;margin-top:12px}.result{text-align:center;display:none}.result h2{font-size:34px}.wrongList{margin:15px auto;max-width:560px;text-align:left;background:#fff8e9;padding:16px;border-radius:16px}.small{font-size:14px;color:#80684e}@media(max-width:650px){.wrap{padding:12px}.card{padding:16px}.brand{font-size:28px}.choices{grid-template-columns:repeat(2,1fr)}.choices button:last-child{grid-column:auto}.keyboard{max-width:none}.keyrow{gap:4px}.keyrow:nth-child(2){padding-left:3%;padding-right:3%}.keyrow:nth-child(3){padding-left:10%;padding-right:10%}.slot{width:29px;font-size:26px}.key{padding:13px 2px;font-size:17px;flex:1;max-width:none;min-width:0}}
</style></head><body><div class="wrap"><div class="card">
<section id="home"><div class="brand"><span class="pump">🎃</span><br>Oscar的南瓜田</div><div class="sub">Spelling Flashcards · 聽音拼字</div><div class="choices" id="lessonBtns"></div><p class="small" style="text-align:center">答錯的單字會自動留下來；每輪結束後只重考錯題，直到 All Clear!</p></section>
<section class="game" id="game"><div class="top"><span id="round"></span><span id="progress"></span><span id="wrongCount"></span></div><button class="listen" id="listen">🔊 再聽一次</button><div class="slots" id="slots"></div><div class="keyboard" id="keyboard"></div><div class="controls"><button class="del" id="del">⌫ 刪除</button><button class="submit" id="submit">✓ 送出</button></div><div class="msg" id="msg"></div></section>
<section class="result" id="result"><h2 id="resultTitle"></h2><div id="resultText"></div><div class="wrongList" id="wrongList"></div><button class="action" id="nextRound"></button><button class="action" id="homeBtn" style="margin-left:8px">回首頁</button></section>
</div></div><script>
const lessons={1:['webbed','waterproof','steer','whistle','otherwise','junior','slippery','finally','feathers','scientist'],2:['cell','leaf','nutrient','plant','root','stem','rookery','flippers','swallow','hatch'],3:['knot','copy','planning','lonely','heavily','seriously','answered','guessed','tracing','soaking'],4:['environment','reproduce','netted','parallel','veins','branch','voice','practice','garage','closet'],5:['yarn','strands','spinning','dye','weave','sharpen','duplicated','delicious','practice','appear'],6:['trouble','picnic','collected','wondering','hundreds','mammal','bird','reptile','fish','amphibian'],7:['tumbling','flung','tangled','empty','swift','peacefully','stream','blazed','separate','bother'],8:['ordinary','special','surrounded','attention','overheard','enormous','palace','fancy','guard','uniform']};
const $=id=>document.getElementById(id), shuffle=a=>[...a].sort(()=>Math.random()-.5);let queue=[],idx=0,typed='',roundNo=1,wrong=new Set(),everWrong=false;
function speak(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(queue[idx]);u.lang='en-US';u.rate=.72;speechSynthesis.speak(u)}
function showWord(){typed='';everWrong=false;$('msg').textContent='';$('progress').textContent=`第 ${idx+1} 題／共 ${queue.length} 題`;$('round').textContent=`第 ${roundNo} 輪`;$('wrongCount').textContent=`錯題 ${wrong.size}`;renderSlots();setTimeout(speak,250)}
function renderSlots(){let w=queue[idx];$('slots').innerHTML=w.split('').map((_,i)=>`<span class="slot">${(typed[i]||'').toUpperCase()}</span>`).join('')}
function type(c){if(typed.length<queue[idx].length){typed+=c.toLowerCase();renderSlots()}}
function submit(){let ans=queue[idx];if(typed.length!==ans.length){$('msg').textContent='還沒拼完喔！';return}if(typed===ans){$('msg').textContent='✓ Correct!';setTimeout(()=>{idx++;idx<queue.length?showWord():finish()},550)}else{wrong.add(ans);everWrong=true;$('wrongCount').textContent=`錯題 ${wrong.size}`;$('msg').textContent='再試一次！';typed='';renderSlots();setTimeout(speak,200)}}
function finish(){ $('game').style.display='none';$('result').style.display='block';if(wrong.size){$('resultTitle').textContent='🎃 這一輪完成！';$('resultText').textContent=`有 ${wrong.size} 個單字要再挑戰一次。`;$('wrongList').innerHTML='<b>錯題：</b> '+[...wrong].join(' · ');$('nextRound').textContent='只重考錯題';$('nextRound').style.display='inline-block'}else{$('resultTitle').textContent='🎉 All Clear!';$('resultText').textContent='這一輪全部拼對了！';$('wrongList').innerHTML='';$('nextRound').style.display='none'}}
function start(words){queue=shuffle(words);idx=0;roundNo=1;wrong=new Set();$('home').style.display='none';$('result').style.display='none';$('game').style.display='block';showWord()}
for(let n=1;n<=8;n++){let b=document.createElement('button');b.textContent=`Lesson ${n}`;b.onclick=()=>start(lessons[n]);$('lessonBtns').appendChild(b)}let all=document.createElement('button');all.textContent='全部 1–8';all.onclick=()=>start(Object.values(lessons).flat());$('lessonBtns').appendChild(all);
['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'].forEach(row=>{
  let rowEl=document.createElement('div');rowEl.className='keyrow';
  row.split('').forEach(c=>{
    let b=document.createElement('button');b.className='key';b.textContent=c;b.onclick=()=>type(c);rowEl.appendChild(b)
  });
  $('keyboard').appendChild(rowEl)
});
$('listen').onclick=speak;$('del').onclick=()=>{typed=typed.slice(0,-1);renderSlots()};$('submit').onclick=submit;$('nextRound').onclick=()=>{queue=shuffle([...wrong]);wrong=new Set();idx=0;roundNo++;$('result').style.display='none';$('game').style.display='block';showWord()};$('homeBtn').onclick=()=>{speechSynthesis.cancel();$('result').style.display='none';$('game').style.display='none';$('home').style.display='block'};
document.addEventListener('keydown',e=>{if($('game').style.display==='block'){if(/^[a-zA-Z]$/.test(e.key))type(e.key);else if(e.key==='Backspace'){$('del').click()}else if(e.key==='Enter')submit()}});
</script></body></html>
