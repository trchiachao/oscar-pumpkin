<script>
const lessons=[{"title": "Lesson 1｜Living Things & Life Cycles", "sections": [{"title": "Leatherback Sea Turtles", "sentences": [["Leatherback sea turtles are named for their soft, leathery shells.", "革龜因為牠們柔軟、像皮革一樣的龜殼而得名。"], ["These turtles live in the ocean for most of the year.", "這些海龜一年中大部分的時間都生活在海洋裡。"], ["However, mother turtles return to the beach to lay their eggs.", "然而，母海龜會回到海灘上產卵。"], ["They dig nests in the sand with their rear flippers.", "牠們用後鰭在沙子裡挖巢。"], ["Each turtle lays her eggs, covers them, and returns to the ocean.", "每隻母海龜產下蛋後，會把蛋覆蓋起來，再回到海洋。"], ["After two months, the eggs begin to hatch.", "兩個月後，海龜蛋開始孵化。"], ["At night, the baby turtles crawl toward the ocean.", "到了晚上，小海龜會朝著海洋爬去。"], ["Young turtles have a small chance that they will get to the ocean.", "小海龜能夠平安抵達海洋的機會很小。"], ["Predators will capture many of them.", "許多小海龜會被掠食者捕捉。"], ["Some will be confused by bright lights near the beach.", "有些小海龜會被海灘附近的強光弄得迷失方向。"], ["Engineers and concerned citizens are working together to find ways to help the baby turtles.", "工程師和關心海龜的民眾正一起合作，想辦法幫助小海龜。"], ["Barriers and signs in some places keep the baby turtles safe.", "有些地方設置圍欄和告示牌，來保護小海龜的安全。"]]}, {"title": "Diversity of Living Things", "sentences": [["Earth has millions of different kinds of organisms.", "地球上有數百萬種不同的生物。"], ["An organism is a living thing, such as a plant or an animal.", "生物就是有生命的東西，例如植物或動物。"], ["You are an organism too!", "你也是一種生物！"], ["The sprouting plant and the newborn elk in the photos are just two of the diverse kinds of organisms on Earth.", "照片中的發芽植物和剛出生的麋鹿，只是地球上各種不同生物中的兩種。"], ["Diverse means that there are many different kinds.", "Diverse 的意思是有許多不同的種類。"], ["Although organisms are diverse, they are alike in some ways.", "雖然生物種類很多，但牠們在某些方面也很相似。"], ["Each organism begins life, grows, and dies.", "每一種生物都會開始生命、成長，最後死亡。"], ["All kinds of organisms also reproduce.", "所有種類的生物也都會繁殖。"], ["When an organism reproduces, it makes more organisms of the same kind as the parent.", "當生物繁殖時，會產生與親代同種類的新生物。"], ["Living things reproduce so that organisms of their kind can continue to live on Earth.", "生物透過繁殖，讓自己的種類能繼續生存在地球上。"]]}, {"title": "Plant Reproduction", "sentences": [["Organisms can begin their life in different ways.", "生物可以用不同的方式開始生命。"], ["We usually think of a seed as the beginning of life for a plant.", "我們通常把種子看作植物生命的開始。"], ["Seeds come in many different sizes, shapes, and colors.", "種子有許多不同的大小、形狀和顏色。"], ["But all seeds have the same parts.", "但是所有種子都有相同的基本構造。"], ["The outside part protects the plant.", "外部的構造會保護植物。"], ["Inside the seed is a tiny plant.", "種子裡面有一株小小的植物。"], ["Under the right conditions, the seed can sprout.", "在適當的條件下，種子可以發芽。"], ["The seed needs air, the right temperature, and the right amount of water to sprout.", "種子需要空氣、適當的溫度和適量的水才能發芽。"], ["The seed has stored food that the tiny plant uses when it starts to grow into a new plant.", "種子裡儲存著養分，供小植物開始長成新植物時使用。"], ["The picture shows a sunflower seed that has begun to sprout.", "圖片顯示一顆已經開始發芽的向日葵種子。"], ["The green part will become the stem and leaves.", "綠色的部分會長成莖和葉子。"], ["Roots will grow downward from the seed.", "根會從種子向下生長。"], ["Soon the new plant will be able to make its own food.", "很快地，新植物就能自己製造養分。"]]}, {"title": "Animal Reproduction", "sentences": [["Most animals start as an egg.", "大多數動物的生命從卵開始。"], ["Some animals start life as an egg that is so small that you can barely see it.", "有些動物一開始是非常小、幾乎看不見的卵。"], ["Others produce eggs that are easy to see.", "其他動物則會產下很容易看見的卵。"], ["Some of these animals lay eggs outside their body.", "其中有些動物會把卵產在體外。"], ["The bird eggs in the photo are very different sizes.", "照片中的鳥蛋大小差異很大。"], ["The largest one is from an ostrich, whose eggs are the largest among birds’ eggs.", "最大的一顆來自鴕鳥；鴕鳥蛋是鳥類中最大的蛋。"], ["Can you tell the size of the birds that laid the other eggs?", "你能從其他蛋判斷下蛋的鳥有多大嗎？"], ["Different animals have different ways of protecting their eggs.", "不同動物有不同的方式保護牠們的卵。"], ["Bird eggs have a hard covering that protects the young birds inside.", "鳥蛋有堅硬的外殼，可以保護裡面的幼鳥。"], ["The fish in the photo carries eggs in its mouth!", "照片中的魚把卵含在嘴裡！"], ["Unlike the bird’s egg, these eggs do not have a hard covering.", "和鳥蛋不同，這些卵沒有堅硬的外殼。"], ["The eggs will stay in the parent's mouth until they hatch.", "這些卵會留在親魚的嘴裡，直到孵化。"], ["Until they do, the parent cannot eat.", "在卵孵化之前，親魚都無法進食。"]]}, {"title": "Life Cycles", "sentences": [["When an animal lays eggs outside of its body, the young animal grows inside the eggs.", "當動物把卵產在體外時，幼小的動物會在卵裡成長。"], ["The egg hatches when the young animal is ready to come out.", "當幼小動物準備好出來時，卵就會孵化。"], ["The ostrich in the photo is coming out of its egg because it is too big for its shell.", "照片中的小鴕鳥正在破殼而出，因為牠已經大到蛋殼容不下了。"], ["For most mammals, the egg starts developing into a young animal inside the mother’s body.", "對大多數哺乳類動物來說，卵會在母體內開始發育成幼小動物。"], ["When the young animal is the right size, it is born.", "當幼小動物長到適當大小時，就會出生。"], ["Young animals, such as elephants, sometimes stay with their parents after they are born.", "有些幼小動物，例如大象，出生後會和父母待在一起。"], ["They leave their parents when they can take care of themselves.", "等到能照顧自己時，牠們才會離開父母。"], ["Other animals do not stay with their young at all.", "其他動物則完全不會陪伴幼小的後代。"], ["Most fish lay their eggs and then leave them.", "大多數魚產卵後就會離開。"], ["The young fish must take care of themselves.", "小魚必須自己照顧自己。"]]}, {"title": "Pattern of Life Cycles", "sentences": [["You have learned how the life cycles of different kinds of organisms can be very different.", "你已經學過，不同種類生物的生命週期可能非常不同。"], ["When a red ant is born, it does not look similar to its parents.", "紅螞蟻剛出生時，看起來和親代並不相像。"], ["But a polar bear looks almost the same as its parent.", "但是北極熊幼獸看起來和親代幾乎一樣。"], ["Yet the life cycles of all organisms are alike in some ways.", "然而，所有生物的生命週期在某些方面都很相似。"], ["Each organism follows the same pattern.", "每一種生物都遵循相同的模式。"], ["It begins life, grows, reproduces, and dies.", "它開始生命、成長、繁殖，最後死亡。"], ["Some organisms hatch from an egg.", "有些生物從卵中孵化。"], ["Others develop inside the mother until they are born.", "其他生物則在母體內發育，直到出生。"], ["Each kind of organism also grows and dies.", "每一種生物也都會成長和死亡。"], ["The amount of time for growth can be very different.", "不同生物成長所需的時間可能差異很大。"], ["A California forest of one kind of tree—the bristlecone pine—has trees that have lived for about 5,000 years!", "加州森林中的一種樹——刺果松——有些已經活了大約五千年！"], ["Some insects, such as this mayfly, live only about a day.", "有些昆蟲，例如這隻蜉蝣，只活大約一天。"]]}]}, {"title": "Lesson 2｜Traits & Variations", "sections": [{"title": "Traits", "sentences": [["The reason that the puppies are so much alike is that they got their traits from their parents.", "這些小狗如此相像，是因為牠們從父母那裡獲得了特徵。"], ["A trait is a feature of an organism.", "Trait 是生物的一種特徵。"], ["A trait can be the way the body of the organism looks or works.", "特徵可以是生物身體的外觀，也可以是身體運作的方式。"], ["It can also be the things the organism does.", "它也可以是生物會做的事情。"], ["For example, some animals know how to walk and feed themselves as soon as they are born.", "例如，有些動物一出生就知道如何走路和自己進食。"], ["These actions are inherited traits.", "這些行為是遺傳特徵。"], ["To inherit something means that you got it from your parents or ancestors.", "Inherit 的意思是從父母或祖先那裡得到某種特徵。"]]}, {"title": "Traits of Parents and Offspring", "sentences": [["Offspring of the same parents have similar inherited traits.", "同一對親代的後代具有相似的遺傳特徵。"], ["Offspring usually look a little like their mother and a little like their father.", "後代通常有些地方像母親，也有些地方像父親。"], ["But they do not look exactly like either parent.", "但是牠們不會和任何一位親代長得完全一樣。"], ["That is why the puppies have some differences.", "這就是為什麼這些小狗之間會有一些差異。"], ["The differences in organisms from the same parent is called variation.", "來自相同親代的生物之間所出現的差異稱為 variation，也就是變異。"]]}, {"title": "Traits in Similar Plants", "sentences": [["The plants in the photos do not come from the same parent plants.", "照片中的植物並不是來自相同的親代植物。"], ["They are, though, the same kind of plant—pea plants.", "不過，牠們是同一種植物——豌豆。"], ["Their flowers and leaves have the same shape.", "牠們的花和葉子形狀相同。"], ["Most pea plants have leaves and flowers with these same shapes.", "大多數豌豆都有這些相同形狀的葉子和花。"], ["But the flowers of the two plants are different colors.", "但是這兩株植物的花顏色不同。"], ["Plants of the same kind have variations in their traits.", "同一種類的植物，其特徵也會有變異。"], ["Color is not the only way plants vary.", "顏色並不是植物產生差異的唯一方式。"], ["The red and orange flowers are all the same kind.", "紅色和橘色的花都是同一種類。"], ["Yet some of the plants are taller than others.", "然而，有些植株比其他植株高。"], ["Plants of the same kind have other variations, such as small differences in leaf shape and color, the number of thorns on a stem, or how rough a tree’s bark is.", "同一種類的植物還會有其他變異，例如葉片形狀與顏色的細微差異、莖上刺的數量，或樹皮粗糙的程度。"]]}, {"title": "Traits in Similar Animals", "sentences": [["One reason people like to collect shells is that shells come in many sizes, shapes, colors, and patterns.", "人們喜歡收集貝殼的一個原因，是貝殼有許多不同的大小、形狀、顏色和花紋。"], ["Some of the differences are because the shells are from different kinds of animals.", "其中一些差異是因為這些殼來自不同種類的動物。"], ["The snail shells in the picture, though, are the same kind of animal—the white-lipped banded snail.", "不過，圖片中的蝸牛殼都來自同一種動物——白唇帶紋蝸牛。"], ["Like plants, animals of the same kind have variations in their traits.", "和植物一樣，同一種類的動物在特徵上也會有變異。"]]}, {"title": "Hide Me", "sentences": [["The mystery environment will probably have predators and prey.", "這個神祕環境中可能會有掠食者和獵物。"], ["Camouflage, or blending in with the surroundings, is one way that animals survive.", "偽裝，也就是融入周遭環境，是動物生存的一種方式。"], ["Animals with the best camouflage are more likely to survive.", "偽裝效果越好的動物，越有可能生存下來。"], ["By blending in with the surroundings, prey animals can avoid being eaten.", "獵物藉由融入周遭環境，可以避免被吃掉。"], ["Predators can use camouflage to hide from their prey until they are ready to strike.", "掠食者也可以利用偽裝躲避獵物的注意，直到準備好出擊。"], ["Draw a line from each animal to the environment where it could be best camouflaged.", "把每一隻動物和最適合牠偽裝的環境連起來。"]]}, {"title": "Mammal Eggs?", "sentences": [["The duck-billed platypus is extreme for more than one reason.", "鴨嘴獸在許多方面都非常特別。"], ["It uses its bill to sense electricity.", "牠會用嘴喙感應電流。"], ["Males produce poison, which is rare among mammals.", "雄性會產生毒液，這在哺乳類動物中很少見。"], ["Females release milk through the skin on their bellies.", "雌性會從腹部的皮膚分泌乳汁。"], ["Perhaps their most unusual feature, though, is that they are mammals that lay eggs!", "不過，牠們最不尋常的特徵或許是：牠們是會產卵的哺乳類動物！"], ["Mammals are warm-blooded animals, with bones.", "哺乳類是有骨骼的恆溫動物。"], ["Scientists think that ancient ancestors of mammals laid eggs.", "科學家認為，古代哺乳類的祖先會產卵。"], ["But that was many millions of years ago.", "但那是數百萬年前的事了。"], ["Today nearly all mammals give live birth.", "如今幾乎所有哺乳類動物都直接生下幼體。"], ["The platypus, however, has inherited the ancient trait of laying eggs.", "然而，鴨嘴獸遺傳了產卵這項古老特徵。"], ["The only other mammals that lay eggs are echidnas.", "其他會產卵的哺乳類動物只有針鼴。"], ["Echidnas are closely related to the platypus.", "針鼴和鴨嘴獸的親緣關係很接近。"]]}]}, {"title": "Lesson 3｜Inherited Traits and the Environment", "sections": [{"title": "Inherited Traits and the Environment", "sentences": [["The pictures show two different saguaro cactuses.", "圖片顯示兩株不同的巨人柱仙人掌。"], ["Saguaro cactuses are usually tall with one main stem.", "巨人柱仙人掌通常很高，並有一根主要的莖。"], ["Some saguaros branch out, while others do not.", "有些巨人柱仙人掌會長出分枝，有些則不會。"], ["Why are their shapes so different?", "為什麼牠們的形狀會如此不同呢？"], ["Scientists studied the growth patterns of saguaro cactuses.", "科學家研究了巨人柱仙人掌的生長模式。"], ["They found that these plants form more branches when the environment has more water.", "他們發現，環境中的水分越多，這些植物就會長出更多分枝。"], ["Many of the traits of a saguaro cactus are inherited from the parents.", "巨人柱仙人掌的許多特徵都是從親代遺傳而來的。"], ["These include its shape.", "這些特徵包括它的形狀。"], ["But the environment also affects the shape of the cactus.", "但是環境也會影響仙人掌的形狀。"], ["The amount of water makes the difference.", "水量的多寡會造成差異。"]]}, {"title": "Environmental Factors", "sentences": [["As you just learned, the amount of water in the environment can affect inherited traits of the cactus.", "就像你剛學到的，環境中的水量會影響仙人掌的遺傳特徵。"], ["This is because the environment can influence, or have an effect on, inherited traits.", "這是因為環境可以 influence，也就是影響遺傳特徵。"], ["Water is just one factor in the environment that can influence inherited traits.", "水只是環境中能影響遺傳特徵的其中一個因素。"], ["Other factors include the kind and amount of food, the temperature, the kind of soil, and the materials in the soil, air, and water.", "其他因素包括食物的種類和數量、溫度、土壤種類，以及土壤、空氣和水中的物質。"], ["The flowers in the picture are hydrangeas.", "圖片中的花是繡球花。"], ["Their color can be blue or pink.", "牠們的花色可以是藍色或粉紅色。"], ["The color depends on the kind of soil the plant grows in.", "花的顏色取決於植物生長的土壤種類。"]]}, {"title": "Sunlight and Plant Traits", "sentences": [["Sunlight is an important factor that affects the traits of plants.", "陽光是影響植物特徵的重要因素。"], ["In the photo, the plant on the left shows how this plant grows when it has the right amount of sunlight.", "照片中左邊的植物顯示了在陽光充足時，這種植物的生長情形。"], ["The plant in the middle did not get enough sunlight.", "中間的植物沒有得到足夠的陽光。"], ["The plant on the right got sunlight only from one side.", "右邊的植物只有一側照到陽光。"]]}]}];let li=0,si=0,qi=0,running=false,paused=false,token=0;

function cur(){return lessons[li].sections[si].sentences[qi]}
function render(){let sec=lessons[li].sections[si];let q=cur();M.textContent=`Lesson ${li+1} / ${lessons.length}　｜　第 ${si+1} / ${lessons[li].sections.length} 段　｜　第 ${qi+1} / ${sec.sentences.length} 句`;ST.textContent=sec.title;EN.textContent=q[0];ZH.textContent=q[1];ZH.classList.remove('speaking');L.value=li;S.value=si}
function voice(lang){let v=speechSynthesis.getVoices();if(lang==='en-US')return v.find(x=>x.lang==='en-US'&&/Samantha|Ava|Google US English/i.test(x.name))||v.find(x=>x.lang.startsWith('en-US'))||v.find(x=>x.lang.startsWith('en'));return v.find(x=>x.lang==='zh-TW')||v.find(x=>x.lang.startsWith('zh'))}
function speak(txt,lang,r){return new Promise(resolve=>{let u=new SpeechSynthesisUtterance(txt);u.lang=lang;u.rate=r;let v=voice(lang);if(v)u.voice=v;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function advance(){let sec=lessons[li].sections[si];if(qi<sec.sentences.length-1){qi++;return true}qi=0;if(si<lessons[li].sections.length-1){si++;fillSections();return true}si=0;if(li<lessons.length-1){li++;fillLessons();fillSections();return true}return false}
async function run(){if(running&&paused){speechSynthesis.resume();paused=false;return}if(running)return;running=true;paused=false;let my=++token;while(running&&my===token){render();await speak(cur()[0],'en-US',+rate.value);if(!running||my!==token)break;await wait(600);ZH.classList.add('speaking');await speak(cur()[1],'zh-TW',Number(zhRate.value));ZH.classList.remove('speaking');if(!running||my!==token)break;await wait(550);if(!autoplay.checked){running=false;break}if(!advance()){running=false;break}}}
function stop(){speechSynthesis.cancel();token++;running=false;paused=false}
function jumpAndPlay(){stop();render();setTimeout(run,120)}
function moveSentence(d){if(d<0){if(qi>0)qi--;else if(si>0){si--;qi=lessons[li].sections[si].sentences.length-1;fillSections()}else if(li>0){li--;si=lessons[li].sections.length-1;qi=lessons[li].sections[si].sentences.length-1;fillLessons();fillSections()}}else{advance()}jumpAndPlay()}
function moveSection(d){if(d<0){if(si>0)si--;else if(li>0){li--;si=lessons[li].sections.length-1;fillLessons()}}else{if(si<lessons[li].sections.length-1)si++;else if(li<lessons.length-1){li++;si=0;fillLessons()}}qi=0;fillSections();jumpAndPlay()}
L.onchange=()=>{stop();li=+L.value;si=0;qi=0;fillSections();render()};S.onchange=()=>{stop();si=+S.value;qi=0;render()};
document.getElementById('play').onclick=run;document.getElementById('pause').onclick=()=>{if(!running)return;if(paused){speechSynthesis.resume();paused=false}else{speechSynthesis.pause();paused=true}};
document.getElementById('prevSent').onclick=()=>moveSentence(-1);document.getElementById('nextSent').onclick=()=>moveSentence(1);
document.getElementById('prevSec').onclick=()=>moveSection(-1);document.getElementById('nextSec').onclick=()=>moveSection(1);
document.getElementById('replay').onclick=jumpAndPlay;
fillLessons();fillSections();render();
</script></body></html>
