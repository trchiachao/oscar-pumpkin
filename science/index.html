<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oscar 的南瓜田｜Science</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  background:#fffaf0; color:#293241;
}
.wrap{max-width:760px;margin:auto;padding:34px 20px 50px}
.back{display:inline-block;text-decoration:none;color:#59636e;font-size:16px;margin-bottom:28px}
.hero{text-align:center;margin-bottom:34px}
.icon{font-size:52px;margin-bottom:8px}
h1{margin:0;font-size:34px}
.sub{margin-top:9px;color:#7a828b;font-size:16px}
.units{display:grid;gap:16px}
.card{
  display:flex;align-items:center;justify-content:space-between;
  text-decoration:none;color:inherit;background:#fff;border:1px solid #eadfce;
  border-radius:22px;padding:22px 24px;box-shadow:0 5px 18px rgba(55,45,30,.07);
}
.card:active{transform:scale(.99)}
.left{display:flex;align-items:center;gap:17px}
.badge{
  width:58px;height:58px;border-radius:18px;background:#e8f4ef;
  display:flex;align-items:center;justify-content:center;font-size:30px
}
.title{font-size:23px;font-weight:750}
.desc{font-size:15px;color:#7a828b;margin-top:4px}
.arrow{font-size:28px;color:#9aa1a8}
.note{text-align:center;color:#9a9288;font-size:14px;margin-top:28px}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../">← 回到 Oscar 的南瓜田</a>
  <section class="hero">
    <div class="icon">🔬</div>
    <h1>Science</h1>
    <div class="sub">選擇要練習的單元</div>
  </section>

  <section class="units">
    <a class="card" href="./unit5/">
      <div class="left">
        <div class="badge">🌱</div>
        <div>
          <div class="title">Unit 5</div>
          <div class="desc">Reading Practice・英文＋中文朗讀</div>
        </div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="card" href="./unit6/">
      <div class="left">
        <div class="badge">🌿</div>
        <div>
          <div class="title">Unit 6</div>
          <div class="desc">Reading Practice・英文＋中文朗讀</div>
        </div>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="card" href="./quiz/">
  <div class="left">
    <div class="badge">🧠</div>
    <div>
      <div class="title">Science Quiz</div>
      <div class="desc">選擇題練習 · Unit 5 + Unit 6</div>
    </div>
  </div>
  <div class="arrow">›</div>
</a>
  </section>

  <div class="note">之後新的 Science 單元會繼續加在這裡。</div>
</main>
</body>
</html>
